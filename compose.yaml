services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gorditasos
      POSTGRES_USER: gorditas
      POSTGRES_PASSWORD: gorditas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorditas -d gorditasos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
